<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flight Lines Progress Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            margin: 0;
            padding: 20px;
        }
        #ui_controls {
            background-color: #333;
            padding: 15px 20px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid #555;
            flex-wrap: wrap;
        }
        #ui_controls select {
            padding: 8px 12px;
            background-color: #222;
            color: #fff;
            border: 1px solid #666;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: 20px;
            font-size: 16px;
            cursor: pointer;
        }
        .checkbox-container input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        /* Project Frame Layouts */
        #dashboard_grid {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        .project-card {
            background-color: #222;
            border: 1px solid #444;
            border-radius: 6px;
            overflow: hidden;
        }
        .project-header {
            background-color: #2d2d2d;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-bottom: 1px solid #444;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }
        .project-header.complete {
            border-left: 5px solid #4caf50;
        }
        .project-header.incomplete {
            border-left: 5px solid #ff7f0e;
        }
        .project-title {
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .project-header.complete .project-title {
            color: #4caf50;
        }
        .project-header.incomplete .project-title {
            color: #ccc;
        }
        /* Status Badges for the Headers */
        .metrics-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .status-badge {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            background-color: #111;
            border: 1px solid #444;
        }
        .status-badge.done {
            border-color: #4caf50;
            color: #4caf50;
            background-color: rgba(76, 175, 80, 0.1);
        }
        .status-badge.pending {
            border-color: #ff7f0e;
            color: #ff7f0e;
            background-color: rgba(255, 127, 14, 0.1);
        }
        .chart-body {
            padding: 15px;
            background-color: #222;
        }
    </style>
</head>
<body>

    <h2>Flight Lines Completion Status Dashboard</h2>
    
    <div id="ui_controls">
        <div style="display: flex; align-items: center; gap: 10px;">
            <label for="project_select" style="font-weight: bold; font-size: 16px;">Filter by Project:</label>
            <select id="project_select">
                <option value="ALL">All Projects</option>
                </select>
        </div>
        
        <label class="checkbox-container">
            <input type="checkbox" id="hide_completed" checked>
            Hide Completed Projects
        </label>
    </div>

    <div id="dashboard_grid">Loading data from ArcGIS REST API...</div>

    <script>
        // ==========================================
        // 1. Configuration Variables
        // ==========================================
        const featureServiceUrl = "https://services2.arcgis.com/C8EMgrsFcRFL6LrL/arcgis/rest/services/db_flight_lines/FeatureServer/0/query";
        
        // YOUR INTEGRATED API KEY
        const apiKey = "AAPTa7H7lF7FgRZozhMFwPOd-sQ..T99jVoD9WeupCl2WfaW7sAWpVuOoyLAPvlJrj-RGb63wqvmIRC6jJow45ti2J9e-GkTGDdEPhoDyG94VMx3-Cb0lRNecDI4jPRmHTnco3YikQtIseu8ZzQJ2eXH-WWkxuR20pZES6sZLEUZL9AfoSlJ1E8fHuHaYsOQ-b2fP9KO1XDw3xHmcQKzkfymEGbw4wfzgGcg-27qGJGq3i-nbfaMFpuW87kqwdVFcsP2e98e9J0sKWiJkxSOIeyfq_Iu5glqw-0eYAT1_CNPm5FcM";
        
        // Dynamically build the final request URL containing the token parameters
        const url = `${featureServiceUrl}?where=1%3D1&outFields=*&f=json&resultRecordCount=2000&token=${apiKey}`;

        // DB Columns -> Display Names
        const categoryMap = {
            'RGB': 'Overall Project Complete',
            'NIR_MHW': 'MHW',
            'NIR_MLLW': 'MLLW',
            'NIR_BMHW': 'BMHW',
            'NIR': 'NT'
        };

        const shortNames = {
            'Overall Project Complete': 'Overall',
            'MHW': 'MHW',
            'MLLW': 'MLLW',
            'BMHW': 'BMHW',
            'NT': 'NT'
        };

        const colorsComplete = ['#1f77b4', '#2ca02c', '#ff7f0e', '#d62728', '#9467bd'];
        const colorsNotComplete = ['#4a9cd3', '#68c468', '#ffb266', '#e66c6d', '#b38bd6']; 

        let globalProjectMap = {};
        let activeCharts = []; 

        // ==========================================
        // 2. Data Fetching & Processing
        // ==========================================
        fetch(url)
            .then(response => response.json())
            .then(data => {
                // If ArcGIS flags an authentication or restriction error, dump it immediately
                if (data.error) {
                    document.getElementById('dashboard_grid').innerHTML = 
                        `<h3 style="color:#ff6b6b;">ArcGIS Error ${data.error.code}: ${data.error.message}</h3>
                        <p>Please check your API key configuration parameters.</p>
                        <pre style="color:#aaa; background:#111; padding:10px;">${JSON.stringify(data, null, 2)}</pre>`;
                    return;
                }

                if (!data || !data.features || !Array.isArray(data.features)) {
                    document.getElementById('dashboard_grid').innerHTML = `<h3 style="color:#ff6b6b;">No Data Returned</h3>`;
                    return; 
                }

                data.features.forEach(feat => {
                    let attrs = feat.attributes;
                    let proj = attrs.Project_ID;
                    if (!proj) return;

                    if (!globalProjectMap[proj]) {
                        globalProjectMap[proj] = { stages: {} };
                        Object.keys(categoryMap).forEach(col => {
                            globalProjectMap[proj].stages[col] = { completed: 0, notCompleted: 0 };
                        });
                    }

                    Object.keys(categoryMap).forEach(col => {
                        let val = attrs[col];
                        let isMissing = (val === null || val === undefined || String(val).trim() === '' || String(val) === 'nan');
                        let isNR = (!isMissing && String(val).trim() === 'N/R');

                        if (isNR) {
                            // Ignore Not Required lines
                        } else if (!isMissing) {
                            globalProjectMap[proj].stages[col].completed += 1;
                        } else {
                            globalProjectMap[proj].stages[col].notCompleted += 1;
                        }
                    });
                });

                let projects = Object.keys(globalProjectMap).sort();
                let selectElem = document.getElementById('project_select');
                projects.forEach(p => {
                    let opt = document.createElement('option');
                    opt.value = p;
                    opt.innerHTML = p;
                    selectElem.appendChild(opt);
                });

                selectElem.addEventListener('change', () => renderDashboard());
                document.getElementById('hide_completed').addEventListener('change', () => renderDashboard());

                renderDashboard();
            })
            .catch(error => {
                document.getElementById('dashboard_grid').innerHTML = `<h3 style="color:#ff6b6b;">Network Error</h3><p>${error.message}</p>`;
            });

        // ==========================================
        // 3. Multi-Chart Dashboard Rendering
        // ==========================================
        function renderDashboard() {
            activeCharts.forEach(chart => chart.destroy());
            activeCharts = [];

            let selectedProject = document.getElementById('project_select').value;
            let hideCompleted = document.getElementById('hide_completed').checked;
            
            let projectsToShow = [];
            if (selectedProject === 'ALL') {
                projectsToShow = Object.keys(globalProjectMap).sort();
            } else {
                projectsToShow = [selectedProject];
            }

            if (hideCompleted) {
                projectsToShow = projectsToShow.filter(p => {
                    let rgbStage = globalProjectMap[p].stages['RGB'];
                    return !(rgbStage.completed > 0 && rgbStage.notCompleted === 0); 
                });
            }

            const container = document.getElementById('dashboard_grid');
            container.innerHTML = "";

            if (projectsToShow.length === 0) {
                container.innerHTML = `<h3 style="color:#ccc; text-align: center; margin-top: 50px;">No projects match the current filters.</h3>`;
                return;
            }

            projectsToShow.forEach((p, pIdx) => {
                let rgbStage = globalProjectMap[p].stages['RGB'];
                let isFullyComplete = (rgbStage.completed > 0 && rgbStage.notCompleted === 0);
                
                let completedData = [];
                let notCompletedData = [];
                let categoriesAxis = [];
                let localColorsComplete = [];
                let localColorsNotComplete = [];
                
                let headerBadgesHtml = `<div class="metrics-container">`;

                Object.keys(categoryMap).forEach((col, idx) => {
                    let compVal = globalProjectMap[p].stages[col].completed;
                    let notCompVal = globalProjectMap[p].stages[col].notCompleted;
                    let totalVal = compVal + notCompVal;

                    if (totalVal > 0) {
                        let displayName = categoryMap[col];
                        let shortName = shortNames[displayName];
                        categoriesAxis.push(displayName);
                        
                        completedData.push(compVal);
                        notCompletedData.push(notCompVal);
                        
                        localColorsComplete.push(colorsComplete[idx]);
                        localColorsNotComplete.push(colorsNotComplete[idx]);

                        let pct = Math.round((compVal / totalVal) * 100);
                        let badgeClass = (pct === 100) ? 'done' : 'pending';
                        
                        headerBadgesHtml += `
                            <div class="status-badge ${badgeClass}">
                                ${shortName}: ${pct}% (${compVal}/${totalVal})
                            </div>
                        `;
                    }
                });

                headerBadgesHtml += `</div>`;

                if (categoriesAxis.length === 0) return;

                // 2. Create Card Dom Elements
                let card = document.createElement('div');
                card.className = 'project-card';
                
                let header = document.createElement('div');
                header.className = `project-header ${isFullyComplete ? 'complete' : 'incomplete'}`;
                
                let titleDiv = document.createElement('div');
                titleDiv.className = 'project-title';
                titleDiv.innerHTML = isFullyComplete ? `✅ Project: ${p} (100% Done)` : `Project: ${p}`;
                
                header.appendChild(titleDiv);
                header.innerHTML += headerBadgesHtml; 
                
                let chartDiv = document.createElement('div');
                chartDiv.className = 'chart-body';
                chartDiv.id = `chart_project_${pIdx}`; 
                
                card.appendChild(header);
                card.appendChild(chartDiv);
                container.appendChild(card);

                let calcHeight = Math.max(140, categoriesAxis.length * 55);

                // 3. ApexCharts Configurations
                var options = {
                    series: [
                        { name: 'Completed', data: completedData },
                        { name: 'Not Completed', data: notCompletedData }
                    ],
                    chart: {
                        type: 'bar',
                        height: calcHeight, 
                        stacked: true,
                        background: '#222',
                        foreColor: '#ccc',
                        toolbar: { show: false }, 
                        animations: { enabled: false }
                    },
                    plotOptions: {
                        bar: {
                            horizontal: true,
                            barHeight: '70%',
                            dataLabels: { position: 'center' }
                        }
                    },
                    colors: [
                        function({ seriesIndex, dataPointIndex }) {
                            return seriesIndex === 0 ? localColorsComplete[dataPointIndex] : localColorsNotComplete[dataPointIndex];
                        }
                    ],
                    fill: {
                        type: ['solid', 'pattern'],
                        pattern: {
                            style: 'slantedLines',
                            width: 5,
                            height: 5,
                            strokeWidth: 1.5
                        }
                    },
                    stroke: {
                        width: 1,
                        colors: ['#222']
                    },
                    dataLabels: {
                        enabled: true,
                        style: { fontSize: '11px', colors: ['#fff'] },
                        formatter: function (val) { return val > 0 ? val : ""; }
                    },
                    xaxis: {
                        categories: categoriesAxis,
                        title: { text: 'Flightlines', style: { color: '#666', fontSize: '11px' } },
                        labels: { formatter: function (val) { return Math.floor(val); } }
                    },
                    yaxis: {
                        labels: {
                            style: { fontSize: '12px', fontWeight: 'bold' },
                            maxWidth: 220 
                        }
                    },
                    tooltip: {
                        theme: 'dark',
                        shared: true,
                        intersect: false,
                        y: { formatter: function (val) { return val + " lines"; } }
                    },
                    legend: { show: false } 
                };

                let chart = new ApexCharts(document.querySelector(`#chart_project_${pIdx}`), options);
                chart.render();
                activeCharts.push(chart);
            });
        }
    </script>
</body>
</html>
