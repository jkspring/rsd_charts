<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flight Lines Progress Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            margin: 0;
            padding: 20px;
        }
        #ui_controls {
            background-color: #333;
            padding: 15px 20px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid #555;
            flex-wrap: wrap;
        }
        #ui_controls select {
            padding: 8px 12px;
            background-color: #222;
            color: #fff;
            border: 1px solid #666;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        .checkbox-container input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        /* Project Frame Layouts */
        #dashboard_grid {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        .project-card {
            background-color: #222;
            border: 1px solid #444;
            border-radius: 6px;
            overflow: hidden;
        }
        .project-header {
            background-color: #2d2d2d;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-bottom: 1px solid #444;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }
        .project-header.complete {
            border-left: 5px solid #4caf50;
        }
        .project-header.incomplete {
            border-left: 5px solid #ff7f0e;
        }
        .project-title {
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .project-header.complete .project-title {
            color: #4caf50;
        }
        .project-header.incomplete .project-title {
            color: #ccc;
        }
        /* Status Badges for the Headers */
        .metrics-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .status-badge {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            background-color: #111;
            border: 1px solid #444;
        }
        .status-badge.done {
            border-color: #4caf50;
            color: #4caf50;
            background-color: rgba(76, 175, 80, 0.1);
        }
        .status-badge.pending {
            border-color: #ff7f0e;
            color: #ff7f0e;
            background-color: rgba(255, 127, 14, 0.1);
        }
        .chart-body {
            padding: 15px;
            background-color: #222;
        }
        
        /* Table View Styles */
        .table-container {
            padding: 15px;
            overflow-x: auto;
        }
        .project-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            color: #eee;
        }
        .project-table th, .project-table td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        .project-table th {
            background-color: #2a2a2a;
            color: #aaa;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .project-table tr:nth-child(even) {
            background-color: #1e1e1e;
        }
        .project-table tr:hover {
            background-color: #292929;
        }
        
        /* Detailed Grid Modifications */
        .detailed-table {
            margin: 0 auto;
            width: 95%; /* Slightly constrained to make the center alignment visible */
        }
        .detailed-table th, .detailed-table td {
            text-align: center; /* Centers all table text */
            border: 1px solid #444;
        }
        .detailed-table th:first-child, .detailed-table td:first-child {
            background-color: #2a2a2a;
        }
        .detailed-table td {
            font-family: monospace;
            font-size: 13px;
        }
        
        .text-green { color: #4caf50; font-weight: bold; }
        .text-orange { color: #ff7f0e; font-weight: bold; }
        .text-nr { color: #666; font-size: 11px; }
    </style>
</head>
<body>

    <h2>Flight Lines Completion Status Dashboard</h2>
    
    <div id="ui_controls">
        <div style="display: flex; align-items: center; gap: 10px;">
            <label for="project_select" style="font-weight: bold; font-size: 16px;">Filter by Project:</label>
            <select id="project_select">
                <option value="ALL">All Projects</option>
            </select>
        </div>

        <div style="display: flex; align-items: center; gap: 10px;">
            <label for="view_mode" style="font-weight: bold; font-size: 16px;">View Mode:</label>
            <select id="view_mode">
                <option value="charts">Charts Only</option>
                <option value="summary_table">Summary Table</option>
                <option value="detailed_table">Detailed Flight Card</option>
                <option value="all">All Views</option>
            </select>
        </div>
        
        <label class="checkbox-container">
            <input type="checkbox" id="hide_completed" checked>
            Hide Completed Projects
        </label>
    </div>

    <div id="dashboard_grid">Loading data from ArcGIS REST API...</div>

    <script>
        // ==========================================
        // 1. Configuration Variables
        // ==========================================
        const featureServiceUrl = "https://services2.arcgis.com/C8EMgrsFcRFL6LrL/arcgis/rest/services/db_flight_lines/FeatureServer/0/query";
        
        // YOUR INTEGRATED API KEY
        const apiKey = "AAPTa7H7lF7FgRZozhMFwPOd-sQ..T99jVoD9WeupCl2WfaW7sAWpVuOoyLAPvlJrj-RGb63wqvmIRC6jJow45ti2J9e-GkTGDdEPhoDyG94VMx3-Cb0lRNecDI4jPRmHTnco3YikQtIseu8ZzQJ2eXH-WWkxuR20pZES6sZLEUZL9AfoSlJ1E8fHuHaYsOQ-b2fP9KO1XDw3xHmcQKzkfymEGbw4wfzgGcg-27qGJGq3i-nbfaMFpuW87kqwdVFcsP2e98e9J0sKWiJkxSOIeyfq_Iu5glqw-0eYAT1_CNPm5FcM";
        
        // Dynamically build the final request URL containing the token parameters
        const url = `${featureServiceUrl}?where=1%3D1&outFields=*&f=json&resultRecordCount=2000&token=${apiKey}`;

        // DB Columns -> Display Names
        const categoryMap = {
            'RGB': 'Overall Project Complete',
            'NIR_MHW': 'MHW',
            'NIR_MLLW': 'MLLW',
            'NIR_BMHW': 'BMHW',
            'NIR': 'NT'
        };

        const shortNames = {
            'Overall Project Complete': 'Overall',
            'MHW': 'MHW',
            'MLLW': 'MLLW',
            'BMHW': 'BMHW',
            'NT': 'NT'
        };

        const colorsComplete = ['#1f77b4', '#2ca02c', '#ff7f0e', '#d62728', '#9467bd'];
        const colorsNotComplete = ['#4a9cd3', '#68c468', '#ffb266', '#e66c6d', '#b38bd6']; 

        let globalProjectMap = {};
        let activeCharts = []; 

        // ==========================================
        // 2. Data Fetching & Processing
        // ==========================================
        fetch(url)
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    document.getElementById('dashboard_grid').innerHTML = 
                        `<h3 style="color:#ff6b6b;">ArcGIS Error ${data.error.code}: ${data.error.message}</h3>
                        <p>Please check your API key configuration parameters.</p>
                        <pre style="color:#aaa; background:#111; padding:10px;">${JSON.stringify(data, null, 2)}</pre>`;
                    return;
                }

                if (!data || !data.features || !Array.isArray(data.features)) {
                    document.getElementById('dashboard_grid').innerHTML = `<h3 style="color:#ff6b6b;">No Data Returned</h3>`;
                    return; 
                }

                data.features.forEach(feat => {
                    let attrs = feat.attributes;
                    let proj = attrs.Project_ID;
                    if (!proj) return;

                    if (!globalProjectMap[proj]) {
                        globalProjectMap[proj] = { stages: {}, lines: [] };
                        Object.keys(categoryMap).forEach(col => {
                            globalProjectMap[proj].stages[col] = { completed: 0, notCompleted: 0 };
                        });
                    }

                    // Extract a line identifier matching the "flightline" schema provided
                    let lineId = attrs.flightline || (attrs.ObjectId ? `Line ${attrs.ObjectId}` : (attrs.OBJECTID ? `Line ${attrs.OBJECTID}` : "Unknown"));
                    
                    // Helper to determine if a tidal value is missing
                    const isMissingVal = (val) => (val === null || val === undefined || String(val).trim() === '' || String(val) === 'nan');
                    
                    // A line is complete ONLY if all four tidal columns have data (or are marked 'N/R')
                    let isLineComplete = !isMissingVal(attrs['NIR_MHW']) && 
                                         !isMissingVal(attrs['NIR_MLLW']) && 
                                         !isMissingVal(attrs['NIR_BMHW']) && 
                                         !isMissingVal(attrs['NIR']);

                    // Store line data for detailed view
                    globalProjectMap[proj].lines.push({
                        id: lineId,
                        RGB: isLineComplete ? 'Complete' : 'Incomplete', // Replaces original RGB data with a clear completion status
                        MHW: attrs['NIR_MHW'],
                        MLLW: attrs['NIR_MLLW'],
                        BMHW: attrs['NIR_BMHW'],
                        NT: attrs['NIR']
                    });

                    // Aggregate counts for summary/charts
                    Object.keys(categoryMap).forEach(col => {
                        if (col === 'RGB') {
                            // Use the new tidal logic for the "Overall Project Complete" (RGB) category
                            if (isLineComplete) {
                                globalProjectMap[proj].stages[col].completed += 1;
                            } else {
                                globalProjectMap[proj].stages[col].notCompleted += 1;
                            }
                        } else {
                            // Keep original logic for counting individual tidal columns
                            let val = attrs[col];
                            let isMissing = isMissingVal(val);
                            let isNR = (!isMissing && String(val).trim() === 'N/R');

                            if (isNR) {
                                // Ignore Not Required lines
                            } else if (!isMissing) {
                                globalProjectMap[proj].stages[col].completed += 1;
                            } else {
                                globalProjectMap[proj].stages[col].notCompleted += 1;
                            }
                        }
                    });
                });

                // Init the UI state based on URL parameters and populated data
                readUrlParams();

                // Listeners
                document.getElementById('project_select').addEventListener('change', () => { 
                    updateUrlParams(); 
                    renderDashboard(); 
                });
                
                document.getElementById('hide_completed').addEventListener('change', () => { 
                    updateProjectDropdown(); 
                    updateUrlParams(); 
                    renderDashboard(); 
                });
                
                document.getElementById('view_mode').addEventListener('change', () => { 
                    updateUrlParams(); 
                    renderDashboard(); 
                });

                renderDashboard();
            })
            .catch(error => {
                document.getElementById('dashboard_grid').innerHTML = `<h3 style="color:#ff6b6b;">Network Error</h3><p>${error.message}</p>`;
            });

        // ==========================================
        // 3. UI Controls & URL Parameter Helpers
        // ==========================================
        
        function updateProjectDropdown() {
            let selectElem = document.getElementById('project_select');
            let currentVal = selectElem.value;
            let hideCompleted = document.getElementById('hide_completed').checked;

            // Reset options
            selectElem.innerHTML = '<option value="ALL">All Projects</option>';

            let projects = Object.keys(globalProjectMap).sort();

            // Filter out completed projects from dropdown if checkbox is active
            if (hideCompleted) {
                projects = projects.filter(p => {
                    let rgbStage = globalProjectMap[p].stages['RGB'];
                    return !(rgbStage.completed > 0 && rgbStage.notCompleted === 0);
                });
            }

            projects.forEach(p => {
                let opt = document.createElement('option');
                opt.value = p;
                opt.innerHTML = p;
                selectElem.appendChild(opt);
            });

            // Retain the current selection if it still exists in the filtered list
            if (projects.includes(currentVal)) {
                selectElem.value = currentVal;
            } else {
                selectElem.value = 'ALL';
            }
        }

        function readUrlParams() {
            const params = new URLSearchParams(window.location.search);
            const projParam = params.get('project');
            const hideParam = params.get('hide_completed');
            const viewParam = params.get('view');

            if (hideParam !== null) {
                document.getElementById('hide_completed').checked = (hideParam === 'true' || hideParam === '1');
            }
            
            // Re-populate dropdown based on hide setting before assigning the specific project
            updateProjectDropdown();

            if (projParam) {
                const selectElem = document.getElementById('project_select');
                if (Array.from(selectElem.options).some(opt => opt.value === projParam)) {
                    selectElem.value = projParam;
                }
            }
            
            if (viewParam) {
                const viewElem = document.getElementById('view_mode');
                if (Array.from(viewElem.options).some(opt => opt.value === viewParam)) {
                    viewElem.value = viewParam;
                }
            }
        }

        function updateUrlParams() {
            const params = new URLSearchParams();
            const proj = document.getElementById('project_select').value;
            const hideComp = document.getElementById('hide_completed').checked;
            const viewMode = document.getElementById('view_mode').value;

            if (proj !== 'ALL') params.set('project', proj);
            if (!hideComp) params.set('hide_completed', 'false');
            if (viewMode !== 'charts') params.set('view', viewMode);

            const queryString = params.toString();
            const newUrl = window.location.pathname + (queryString ? '?' + queryString : '');
            window.history.replaceState({}, '', newUrl);
        }

        // ==========================================
        // 4. Multi-View Dashboard Rendering
        // ==========================================
        function renderDashboard() {
            activeCharts.forEach(chart => chart.destroy());
            activeCharts = [];

            let selectedProject = document.getElementById('project_select').value;
            let hideCompleted = document.getElementById('hide_completed').checked;
            let viewMode = document.getElementById('view_mode').value;
            
            let projectsToShow = [];
            if (selectedProject === 'ALL') {
                projectsToShow = Object.keys(globalProjectMap).sort();
            } else {
                projectsToShow = [selectedProject];
            }

            if (hideCompleted) {
                projectsToShow = projectsToShow.filter(p => {
                    let rgbStage = globalProjectMap[p].stages['RGB'];
                    return !(rgbStage.completed > 0 && rgbStage.notCompleted === 0); 
                });
            }

            const container = document.getElementById('dashboard_grid');
            container.innerHTML = "";

            if (projectsToShow.length === 0) {
                container.innerHTML = `<h3 style="color:#ccc; text-align: center; margin-top: 50px;">No projects match the current filters.</h3>`;
                return;
            }

            let globalMaxLines = 0;
            projectsToShow.forEach(p => {
                Object.keys(categoryMap).forEach(col => {
                    let totalVal = globalProjectMap[p].stages[col].completed + globalProjectMap[p].stages[col].notCompleted;
                    if (totalVal > globalMaxLines) {
                        globalMaxLines = totalVal;
                    }
                });
            });

            projectsToShow.forEach((p, pIdx) => {
                let rgbStage = globalProjectMap[p].stages['RGB'];
                let isFullyComplete = (rgbStage.completed > 0 && rgbStage.notCompleted === 0);
                
                let completedData = [];
                let notCompletedData = [];
                let categoriesAxis = [];
                let localColorsComplete = [];
                let localColorsNotComplete = [];
                
                let headerBadgesHtml = `<div class="metrics-container">`;
                let summaryRowsHtml = "";

                // Aggregate Data Processing
                Object.keys(categoryMap).forEach((col, idx) => {
                    let compVal = globalProjectMap[p].stages[col].completed;
                    let notCompVal = globalProjectMap[p].stages[col].notCompleted;
                    let totalVal = compVal + notCompVal;

                    if (totalVal > 0) {
                        let displayName = categoryMap[col];
                        let shortName = shortNames[displayName];
                        categoriesAxis.push(displayName);
                        completedData.push(compVal);
                        notCompletedData.push(notCompVal);
                        localColorsComplete.push(colorsComplete[idx]);
                        localColorsNotComplete.push(colorsNotComplete[idx]);

                        let pct = Math.round((compVal / totalVal) * 100);
                        let badgeClass = (pct === 100) ? 'done' : 'pending';
                        
                        headerBadgesHtml += `<div class="status-badge ${badgeClass}">${shortName}: ${pct}% (${compVal}/${totalVal})</div>`;
                        summaryRowsHtml += `
                            <tr>
                                <td><strong>${displayName}</strong> (${shortName})</td>
                                <td>${compVal}</td>
                                <td>${notCompVal}</td>
                                <td>${totalVal}</td>
                                <td class="${pct === 100 ? 'text-green' : 'text-orange'}">${pct}%</td>
                            </tr>
                        `;
                    }
                });
                headerBadgesHtml += `</div>`;

                // Build Card Container
                let card = document.createElement('div');
                card.className = 'project-card';
                
                let header = document.createElement('div');
                header.className = `project-header ${isFullyComplete ? 'complete' : 'incomplete'}`;
                
                let titleDiv = document.createElement('div');
                titleDiv.className = 'project-title';
                titleDiv.innerHTML = isFullyComplete ? `✅ Project: ${p} (100% Done)` : `Project: ${p}`;
                
                header.appendChild(titleDiv);
                header.innerHTML += headerBadgesHtml; 
                card.appendChild(header);

                // --- 1. Summary Table View ---
                if (viewMode === 'summary_table' || viewMode === 'all') {
                    let tableDiv = document.createElement('div');
                    tableDiv.className = 'table-container';
                    tableDiv.innerHTML = `
                        <h4 style="margin: 5px 0 10px; color:#ccc;">Summary Overview</h4>
                        <table class="project-table">
                            <thead>
                                <tr>
                                    <th>Stage Category</th>
                                    <th>Completed Lines</th>
                                    <th>Remaining Lines</th>
                                    <th>Total Lines</th>
                                    <th>Progress</th>
                                </tr>
                            </thead>
                            <tbody>${summaryRowsHtml}</tbody>
                        </table>
                    `;
                    card.appendChild(tableDiv);
                }

                // --- 2. Chart View ---
                if (viewMode === 'charts' || viewMode === 'all') {
                    let chartDiv = document.createElement('div');
                    chartDiv.className = 'chart-body';
                    chartDiv.id = `chart_project_${pIdx}`; 
                    card.appendChild(chartDiv);
                }

                // --- 3. Detailed Flight Card View ---
                if (viewMode === 'detailed_table' || viewMode === 'all') {
                    let detailDiv = document.createElement('div');
                    detailDiv.className = 'table-container';
                    
                    // Sort lines alphanumerically
                    let sortedLines = globalProjectMap[p].lines.sort((a, b) => String(a.id).localeCompare(String(b.id), undefined, {numeric: true}));
                    
                    let detailRows = "";
                    sortedLines.forEach(l => {
                        const fVal = (v) => {
                            if (v === null || v === undefined || String(v).trim() === '' || String(v) === 'nan') return '';
                            if (String(v).trim() === 'N/R') return '<span class="text-nr">N/R</span>';
                            return v; 
                        };
                        
                        // We highlight 'Incomplete' so it stands out immediately for the flight crew
                        let rgbDisplay = l.RGB;
                        if (l.RGB === 'Incomplete') {
                            rgbDisplay = '<span class="text-orange">Incomplete</span>';
                        } else if (l.RGB === 'Complete') {
                            rgbDisplay = '<span class="text-green">Complete</span>';
                        }
                        
                        detailRows += `
                            <tr>
                                <td style="font-weight:bold; color:#ccc;">${l.id}</td>
                                <td>${rgbDisplay}</td>
                                <td>${fVal(l.MHW)}</td>
                                <td>${fVal(l.MLLW)}</td>
                                <td>${fVal(l.BMHW)}</td>
                                <td>${fVal(l.NT)}</td>
                            </tr>
                        `;
                    });

                    detailDiv.innerHTML = `
                        <h4 style="margin: 10px 0 10px; color:#ccc; text-align: center;">Photographer's Flight Card</h4>
                        <table class="project-table detailed-table">
                            <thead>
                                <tr>
                                    <th>Flight Line</th>
                                    <th>Requirements Complete</th>
                                    <th>MHW</th>
                                    <th>MLLW</th>
                                    <th>BMHW</th>
                                    <th>NT</th>
                                </tr>
                            </thead>
                            <tbody>${detailRows}</tbody>
                        </table>
                    `;
                    card.appendChild(detailDiv);
                }

                container.appendChild(card);

                // Render Chart if enabled
                if ((viewMode === 'charts' || viewMode === 'all') && categoriesAxis.length > 0) {
                    let calcHeight = Math.max(120, categoriesAxis.length * 50);
                    var options = {
                        series: [
                            { name: 'Completed', data: completedData },
                            { name: 'Not Completed', data: notCompletedData }
                        ],
                        chart: {
                            type: 'bar',
                            height: calcHeight, 
                            stacked: true,
                            background: '#222',
                            foreColor: '#ccc',
                            toolbar: { show: false }, 
                            animations: { enabled: false }
                        },
                        grid: { padding: { top: -15, bottom: -5 } },
                        plotOptions: {
                            bar: {
                                horizontal: true,
                                barHeight: '70%',
                                dataLabels: { position: 'center' }
                            }
                        },
                        colors: [
                            function({ seriesIndex, dataPointIndex }) {
                                return seriesIndex === 0 ? localColorsComplete[dataPointIndex] : localColorsNotComplete[dataPointIndex];
                            }
                        ],
                        fill: {
                            type: ['solid', 'pattern'],
                            pattern: { style: 'slantedLines', width: 5, height: 5, strokeWidth: 1.5 }
                        },
                        stroke: { width: 1, colors: ['#222'] },
                        dataLabels: {
                            enabled: true,
                            style: { fontSize: '11px', colors: ['#fff'] },
                            formatter: function (val) { return val > 0 ? val : ""; }
                        },
                        xaxis: {
                            categories: categoriesAxis,
                            max: globalMaxLines,
                            tickAmount: globalMaxLines < 15 ? globalMaxLines : undefined, 
                            labels: { formatter: function (val) { return Math.floor(val); } }
                        },
                        yaxis: {
                            labels: { style: { fontSize: '12px', fontWeight: 'bold' }, maxWidth: 220 }
                        },
                        tooltip: { theme: 'dark', shared: true, intersect: false, y: { formatter: function (val) { return val + " lines"; } } },
                        legend: { show: false } 
                    };

                    let chart = new ApexCharts(document.querySelector(`#chart_project_${pIdx}`), options);
                    chart.render();
                    activeCharts.push(chart);
                }
            });
        }
    </script>
</body>
</html>
